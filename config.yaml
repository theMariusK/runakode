---
# --- General ---
address: 127.0.0.1
port: 8080
rabbitmq:
  url: "amqp://guest:guest@localhost:5672/"
  queue: "runner_jobs"
supportedLanguages:
  - "python"
  - "go"

# --- API ---
apiTimeout: 15

# --- Worker ---
maxWorkers: 2
jobCpu: "1"
jobMemory: "1024m"
jobTimeout: 10
outputMaxBytes: 1048576

# --- Sandbox Images ---
sandboxImages:
  python: "python-runner"
  go: "go-runner"
